[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "indiegogo-scraper"
version = "0.1.0"
description = "Scrape indiegogo.com project listings, campaigns and reward tiers with Playwright, Selenium, Puppeteer or the 2Captcha Scraping Browser API"
readme = "README.md"
license = { file = "LICENSE" }
# 3.9 is CLAIMED, so CI runs a 3.9 leg and smoke_test.py has a check that
# fails on syntax newer than it. Claiming a version without testing it is
# how a walrus operator ships.
requires-python = ">=3.9"
authors = [{ name = "2scraper" }]
keywords = ["indiegogo", "crowdfunding", "web-scraping", "scraper",
            "playwright", "selenium", "puppeteer", "captcha-solver",
            "scraping-browser", "proxy", "fingerprints"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = ["beautifulsoup4>=4.12", "requests>=2.31"]

[project.urls]
Homepage = "https://github.com/2scraper/indiegogo-scraper"
Issues = "https://github.com/2scraper/indiegogo-scraper/issues"

# One engine at a time. These three declare mutually unsatisfiable pins
# (pyee <12 vs >=13 between playwright and pyppeteer; urllib3 <2.0 vs >=2.6
# between pyppeteer and selenium), so installing more than one into the same
# environment lets pip resolve the conflict by downgrading something you
# wanted. A sibling repo ended up with pyppeteer 0.0.25 -- a stub -- that way,
# and CI was green against a version the repo does not support.
[project.optional-dependencies]
playwright = ["playwright>=1.40.0"]
puppeteer = ["pyppeteer>=1.0.2"]
selenium = ["selenium>=4.15.0"]

[tool.setuptools]
# Listed EXPLICITLY. This is a flat collection of scripts rather than a
# package, and setuptools refuses to guess among this many top-level modules.
py-modules = [
  "captcha_solver",
  "diff_runs",
  "env_config",
  "fingerprint_client",
  "output_writer",
  "page_flow",
  "playwright_scraper",
  "product_parser",
  "proxy_pool",
  "puppeteer_scraper",
  "scraper_api_client",
  "selenium_scraper",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
