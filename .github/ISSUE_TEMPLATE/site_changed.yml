name: Site changed / selectors broke
description: indiegogo.com changed something and the parser no longer matches.
labels: ["site-change"]
body:
  - type: markdown
    attributes:
      value: |
        This is the most common way a scraper stops working, and it is worth its
        own report because the fix is different from a code bug: something on
        indiegogo.com moved.

        Useful to know before filing: **this site has no JSON-LD anywhere.**
        `--mode search` reads the results payload inlined in the search page
        and the site's own `searchProjectsForCards` POST for later pages;
        `--mode campaign` reads `window.__INITIAL_STATE__`; `--mode rewards`
        reads the reward boxes by their `data-qa` attributes. The rendered
        cards (`data-qa` hooks) are the fallback for a missing search
        payload. Which of those broke narrows the fix a lot.

  - type: dropdown
    id: mode
    attributes:
      label: Which --mode
      options:
        - search
        - campaign
        - rewards
        - not sure / more than one
    validations:
      required: true

  - type: dropdown
    id: what_broke
    attributes:
      label: What stopped matching
      options:
        - Rows (0 rows on a page that visibly has data)
        - A specific field is null or wrong (price, backers, currency, campaign_end, ...)
        - Price coverage dropped below the floor logged in the run output
        - Pagination stops early or repeats a page
        - The bot-challenge detector finds nothing on a page that has one
        - The inlined search payload or __INITIAL_STATE__ is missing
        - Something else
    validations:
      required: true

  - type: input
    id: url
    attributes:
      label: URL
      description: The exact page URL you ran against.
      placeholder: "https://www.indiegogo.com/en/projects/search?projectCatalogCategories=BoardAndCardGames"
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence from the page
      description: |
        Whichever of these you can get. A capture beats a description.

        - The relevant card's or reward box's HTML (right-click it on the
          real site -> Copy -> Copy outerHTML), or the snapshot written by
          `--dump-html` against this URL.
        - For a field problem: the value you got, and the value on the page.
        - For a campaign problem: whether the page source still contains
          `window.__INITIAL_STATE__` at all (view source and search for it).
      render: text
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: >-
        Whether it reproduces on a second engine, and when it last worked.
